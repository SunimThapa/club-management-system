<link rel="stylesheet" href="../css/style.css">
<form id="registerForm">

    <input
        type="text"
        id="name"
        placeholder="Full Name"
        required
    >

    <input
        type="email"
        id="email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >
    
    <button type="submit">
        Register
    </button>

</form>
<script type="module" src="../../src/js/pages/signUp.js"></script>
