<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClubHub - Sign In</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="page">
    <section class="intro">
      <div class="brand">
        <div class="brand-logo"><img src="../../public/images/logo.jpg" alt="logo" class="logo"></div>
        <div>
          <div class="brand-name">Club<span>Hub</span></div>
          <div class="brand-subtitle">College COMMUNITY</div>
        </div>
      </div>

      <div class="intro-content">
        <p class="eyebrow">COLLEGE CLUB MANAGEMENT</p>
        <h1>Connect.<br><span>Collaborate.</span><br>Create.</h1>
        <p class="description">One place to discover clubs, manage events, connect with students, and build a stronger college community.</p>
      </div>
    </section>

    <section class="login-card">
      <div class="user-icon"><img src="../../public/images/user.jpg" alt="userimg" class="user-img"></div>
      <h2>Welcome back</h2>
      <p class="login-subtitle">Sign in to acces your club dashboard</p>

      <form id="logInForm">
        <label for="email">Email</label>
        <div class="input-wrap">
          <span class="field-icon">✉</span>
          <input id="email" type="email" placeholder="Enter your email">
        </div>

        <!-- <div class="password-label">
          <label for="password">Password</label>
          <a href="#">Forgot password?</a>
        </div> -->
        <div class="input-wrap">
          <span class="field-icon"><img src="../../public/images/lock.png" alt="lock" class="lock"></span>
          <input id="password" type="password" placeholder="Enter your password">
          <span class="eye" id="togglePassword"><img src="../../public/images/eye.png" alt="eye" class="eye-img"></span>
        </div>
        <button type="submit" id="signIn-btn">Sign in <span>→</span></button>
      </form>

      <div class="or"><span></span><p>OR</p><span></span></div>

      <p class="create-account">Don’t have an account? <a href="#">Create an account</a></p>
      <!-- <p class="secure"><img src="../../public/images/secure.png" alt="" class="secure-img">&nbsp; Your information is securely encrypted</p> -->
    </section>
  </main>
  <script type="module" src="../js/pages/logIn.js"></script>
</body>
</html>
